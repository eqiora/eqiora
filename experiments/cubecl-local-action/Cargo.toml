[package]
name = "eqiora-cubecl-local-action-experiment"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
rust-version = "1.92"

[workspace]

[features]
default = []
cuda = ["cubecl/cuda"]
hip = ["cubecl/hip"]

[dependencies]
cubecl = { version = "=0.11.3", default-features = false, features = ["std"] }
eqiora-ir = { path = "../../crates/eqiora-ir" }

[dev-dependencies]
eqiora-meshing = { path = "../../crates/eqiora-meshing" }
eqiora-numerics = { path = "../../crates/eqiora-numerics" }

[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
