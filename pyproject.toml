[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "eqiora"
dynamic = ["version"]
description = "Typed mathematical modeling and execution from one canonical model"
readme = "bindings/python/README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Eqiora contributors" }]
dependencies = ["numpy>=2.1,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]

[project.optional-dependencies]
gmsh = ["gmsh==4.15.2"]
jax = [
    "jax==0.11.0; python_version >= '3.12'",
    "jaxlib==0.11.0; python_version >= '3.12'",
]
matplotlib = ["matplotlib>=3.10,<3.12"]
viewer = ["anywidget==0.11.0"]
torch = ["torch>=2.13,<2.14"]

[dependency-groups]
release-tools = ["twine==7.0.0", "uv==0.12.13"]

[project.urls]
Homepage = "https://eqiora.org"
Documentation = "https://eqiora.org"
Repository = "https://github.com/nkiyohara/eqiora"
Issues = "https://github.com/nkiyohara/eqiora/issues"
Changelog = "https://github.com/nkiyohara/eqiora/blob/main/CHANGELOG.md"
Security = "https://github.com/nkiyohara/eqiora/security/policy"

[tool.maturin]
include = [
    { path = "steady-flow-past-cylinder.eqi", from = "out-dir", to = "eqiora/examples/" },
    { path = "transient-flow-past-cylinder.eqi", from = "out-dir", to = "eqiora/examples/" },
    { path = "mixed-boundary-elasticity.eqi", from = "out-dir", to = "eqiora/examples/" },
    { path = "fixed-reference-fsi.eqi", from = "out-dir", to = "eqiora/examples/" },
    { path = "bindings/python/frontend/package.json", format = "sdist" },
    { path = "bindings/python/frontend/package-lock.json", format = "sdist" },
    { path = "bindings/python/frontend/biome.json", format = "sdist" },
    { path = "bindings/python/frontend/tsconfig.json", format = "sdist" },
    { path = "bindings/python/frontend/playwright.viewer.config.ts", format = "sdist" },
    { path = "bindings/python/frontend/vite.config.ts", format = "sdist" },
    { path = "bindings/python/frontend/src/**", format = "sdist" },
    { path = "bindings/python/frontend/tests/**", format = "sdist" },
]
# Do not exclude the repository-root target tree here: maturin applies these
# patterns to explicit out-dir includes as well. The git sdist generator admits
# only tracked source files, while the generated Model resource is copied from
# Cargo OUT_DIR by the explicit include above.
exclude = [
    ".git/**",
    "**/.git/**",
    # A symlink onto AGENTS.md, so it is neither a regular file nor a
    # directory, and `safe_extract_sdist` rejects any other member kind. It is
    # repository-development instruction anyway and has no place in a wheel.
    "CLAUDE.md",
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",
    "bindings/python/.venv/**",
    "bindings/python/dist/**",
    "studio/node_modules/**",
    "studio/dist/**",
    "studio/test-results/**",
    "studio/playwright-report/**",
]
locked = true
manifest-path = "crates/eqiora-python/Cargo.toml"
module-name = "eqiora._eqiora"
python-source = "bindings/python/python"
sdist-generator = "git"
strip = true

[tool.eqiora-distribution]
ordinary-gil-cpython = ["3.11", "3.12", "3.13", "3.14"]
wheel-platform = "manylinux_2_17_x86_64"
extras-python = "3.13"
numpy-floor-python = "3.12"
tested-numpy-floor = "numpy==2.1.0"
pytest = "pytest==9.1.1"
mypy = "mypy==2.3.0"
tested-torch = "torch==2.13.0"
tested-jax = ["jax==0.11.0", "jaxlib==0.11.0"]
tested-matplotlib = "matplotlib==3.11.1"
