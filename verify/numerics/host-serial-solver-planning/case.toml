id = "numerics.host-serial-solver-planning"
status = "implemented"
scope = "deterministic-host-serial-real-and-complex-csr-solver-planning-v10"
reference_kind = "independent-exact-rational-and-literal-policy-table"

capabilities = [
  "exact-frozen-five-candidate-real-general-catalog",
  "exact-typed-complex-catalogs-and-adjoint-solves",
  "declared-real-spd-indefinite-symmetric-tuples",
  "bounded-work-proxy-with-explicit-horizon-assumptions",
  "scoped-numeric-payload-preflight-and-current-system-recheck",
  "optional-provider-availability-before-ranking",
  "deterministic-robust-fast-low-memory-policy-v10",
  "inspectable-provider-plan-evidence-and-reasons",
  "hard-capability-admission-before-ranking",
  "exact-manual-decision-execution-parity",
  "independent-true-residual-acceptance",
  "zero-work-profile-and-catalog-rejection",
  "one-attempt-selected-execution",
]

[authority]
required_companion_case = "numerics.host-serial-solver-planning-private"
verification_requires_both_cases = true
public_observation_owner = "crates/eqiora/tests/host_serial_solver_planning.rs"
policy_oracle = "expected/policy-v10.json"

[problem]
profile = "one immutable normal-orientation canonical-CSR complete-diagonal General f64 system"
matrix = "[[4, 1], [2, 3]]"
right_hand_side = "[6, 8]"
exact_solution = "[1, 2]"

[catalog]
count = 5
identity = "exact candidate ID, evidence case, provider release and dependencies, and solver-policy tuple"
policy = "eqiora.solver-planning/v10"

[real_class_catalogs]
count = 25
profiles = ["SymmetricPositiveDefinite", "SymmetricIndefinite", "Symmetric"]
spd_proof = "leading principal minors 4 and 11"
indefinite_proof = "eigenvalues 3 and -1"
payload_scope = "typed CSR/RHS and supported Reference real heap numeric workspace; not RSS"
work_scope = "declared deterministic proxy; not measured timing or reuse authority"

[complex_catalog]
count = 28
profiles = ["General", "ComplexSymmetric", "Hermitian", "HermitianPositiveDefinite"]
scalar = "complex f64"
normal_solution = "[1+2i, -2+i]"
adjoint_solution = "[2-i, 1+3i]"
hpd_proof = "leading principal minors 4 and 11"
ordinary_hpd_recognition = false

[acceptance]
componentwise_solution_error = "<= 2^-40"
true_residual = "independently reapplied through the accepted operator"
manual_decision_solution_and_report = "exact equality"
failed_preflight_numerical_calls = 0
selected_execution_attempts = 1

[claim_boundary]
normal_orientation = true
canonical_csr = true
complete_diagonal = true
operator_properties = "General"
scalar = "f64"
execution = "eqiora.host.serial"
catalog_is_frozen = true
performance_superiority = false
fallback_or_retry = false
transport = false
learning = false
durable_decision_artifact = false

[evidence]
package = "eqiora"
test = "host_serial_solver_planning"
