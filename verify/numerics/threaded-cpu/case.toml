id = "numerics.threaded-cpu"
status = "implemented"
scope = "host-threaded-ordered-assembly-and-linear-execution"
reference_kind = "worker-independent-assembly-reaction-and-true-residual"

capabilities = [
  "run-owned-rayon-pool",
  "ordered-parallel-p1-assembly",
  "ordered-parallel-q1-assembly-2d-3d",
  "ordered-parallel-tpfa-cell-facet-assembly-2d-3d",
  "multi-target-local-packet",
  "separate-assembly-placement-evidence",
  "partitioned-row-operator",
  "fixed-order-parallel-inner-product",
  "reproducible-worker-independent-result",
  "execution-placement-evidence",
  "host-worker-capability-fail-closed",
  "portable-typed-realization-dag",
  "deployment-bound-host-execution-receipt",
  "exact-provider-release-provenance",
  "same-id-provider-version-substitution-rejection",
  "serial-rayon-common-logical-execution-dag",
  "pre-pool-capability-rejection",
  "exact-realization-admission-tuples",
  "resolved-operator-property-sealing",
  "reference-minres-jacobi-spd-and-symmetric-indefinite",
  "minres-jacobi-original-residual-and-exact-rayon-provenance",
  "minres-jacobi-nonpositive-diagonal-rejection",
  "canonical-normal-transpose-adjoint-row-actions",
  "all-advertised-reference-complex-reproducible-tuples",
  "complex-lowering-preserves-exact-host-execution",
  "explicit-common-host-plan-result-reopening",
  "manual-and-automatic-real-complex-common-host-execution",
  "exact-execution-authentication-before-ranking",
  "unmodeled-host-execution-costs-remain-unknown",
  "nonserial-numeric-payload-bound-unproved-rejection",
]

[problem]
model = "canonical one-, two-, and three-dimensional Poisson; two exact real symmetric 2x2 CSR systems"
method = "continuous P1/Q1 Galerkin FEM and orthogonal cell-centered TPFA"
scalar = "f64 assembly; real/complex binary64 linear solves"
layout = "replicated"
workers = "one and four"

[complex_solver]
properties = "General, ComplexSymmetric, Hermitian, HermitianPositiveDefinite"
selection = "every advertised Reference complex Reproducible tuple"
orientations = "normal and conjugate-transposed"
relative_tolerance = "0"
absolute_tolerance = "2^-40"
componentwise_error = "<= 2^-39"
maximum_iterations = 16
performance = false

[evidence]
package = "eqiora"
test = "threaded_cpu"
features = ["rayon"]
