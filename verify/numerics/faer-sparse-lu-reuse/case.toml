id = "numerics.faer-sparse-lu-reuse"
status = "implemented"
scope = "host-serial-run-local-faer-sparse-lu-symbolic-reuse"
reference_kind = "dual-independent-exact-scientific-oracle-plus-focused-provider-falsifiers"

capabilities = [
  "backend-neutral-prepared-linear-provider-session",
  "assembly-owned-exact-structure-identity",
  "provider-private-symbolic-and-numeric-factors",
  "same-identity-and-actual-csr-topology-symbolic-reuse",
  "changed-coefficients-numeric-refactorization",
  "failed-candidate-state-retention",
  "cold-warm-solution-and-report-equality",
]

[authority]
required_companion_case = "numerics.faer-sparse-lu-reuse-private"
verification_requires_both_cases = true
public_observation_owner = "crates/eqiora/tests/faer_sparse_lu_reuse.rs"
scientific_oracle_a = "expected/analytic.json"
scientific_oracle_b = "expected/symbolic.json"

[problem]
equation = "-div(diffusion * grad(potential)) - source_scale = 0"
boundary = "trace(potential) - boundary_offset = 0 at x=0 and x=1"
domain = "[0, 1]"
method = "continuous Q1 Galerkin"
uniform_elements = 2
points = ["p0=(2,1,0)", "p1=(4,1,0)", "p2=(2,5/4,0)"]
reduced_systems = ["[4]x=[1]", "[4]x=[2]", "[5]x=[1]"]
exact_solutions = ["1/4", "1/2", "1/5"]

[execution]
target = "one host CPU"
layout = "replicated"
scalar = "f64"
solver = "SparseLu"
preconditioner = "Identity"
reduction = "Fast"
parallelism = "Par::Seq"

[acceptance]
solution_error_ceiling = "2^-32"
cold_warm_solution_and_report_equal = true
same_structure_symbolic_factorizations = 1
changed_value_numeric_factorizations = 2
identity_change_rebuilds_symbolic_before_numeric = true
actual_csr_topology_change_rebuilds_symbolic_before_numeric = true
failed_numeric_candidate_retains_last_accepted_factors = true

[claim_boundary]
general_cache = false
process_global_state = false
persistent_or_durable_factorization = false
cross_process_machine_release_provider_or_hardware_reuse = false
multi_rhs_or_block_solve = false
cuda = false
mpi = false
performance_or_scale = false

[evidence]
package = "eqiora"
test = "faer_sparse_lu_reuse"
