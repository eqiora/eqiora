[package]
name = "eqiora-studio"
version = "0.1.0-alpha.1"
description = "Accessible native projection of canonical Eqiora models"
authors = ["Eqiora contributors"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nkiyohara/eqiora"
rust-version = "1.89"

[lib]
name = "eqiora_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
eqiora = { version = "=0.1.0-alpha.11", path = "../../crates/eqiora", default-features = false, features = ["cad-truck", "faer", "rayon"] }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"

[dev-dependencies]
serde_json = "1.0.149"

[workspace]

[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
