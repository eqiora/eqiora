name: Python release candidate

run-name: Python candidate / ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact clean public commit to build and stage
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: python-candidate-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  prepare-family:
    name: Prepare immutable distribution family
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Bind manual source to the dispatch revision
        env:
          SELECTED_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$SELECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SELECTED_COMMIT" = "$GITHUB_SHA"
      - name: Check out the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact requested commit
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
      - name: Set up candidate driver
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install candidate-manifest validation tooling
        run: |
          python -m pip install --only-binary=:all: "packaging==24.0"
      - name: Prepare the exact one-sdist stable-ABI-wheel family
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
        run: python3 tools/release/python_candidate.py prepare --expected-commit "$CANDIDATE_COMMIT" --require-tag --out "$RUNNER_TEMP/candidate-family"
      - name: Retain immutable prepared family
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eqiora-python-prepared-family
          path: ${{ runner.temp }}/candidate-family/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  finalize-candidate:
    name: Finalize accepted candidate metadata
    needs: prepare-family
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      manifest_sha256: ${{ steps.identity.outputs.manifest_sha256 }}
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact requested commit
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install candidate-manifest validation tooling
        run: |
          python -m pip install --only-binary=:all: "packaging==24.0"
      - name: Install Gmsh native runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libglu1-mesa
      - name: Download immutable prepared family
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eqiora-python-prepared-family
          path: ${{ runner.temp }}/candidate-family
      - name: Finalize exact profiles and candidate metadata
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
        run: |
          python3 tools/release/python_candidate.py finalize \
            --expected-commit "$CANDIDATE_COMMIT" \
            --artifacts "$RUNNER_TEMP/candidate-family" \
            --manifest-out "$RUNNER_TEMP/candidate-metadata"
      - name: Record accepted manifest identity
        id: identity
        run: |
          mapfile -t manifests < <(find "$RUNNER_TEMP/candidate-metadata" -maxdepth 1 -type f -name '*-python-candidate.json')
          test "${#manifests[@]}" -eq 1
          manifest="${manifests[0]}"
          manifest_sha256="$(sha256sum "$manifest" | cut -d ' ' -f 1)"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
      - name: Retain finalized distribution family
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eqiora-python-finalized-family
          path: ${{ runner.temp }}/candidate-family/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain candidate manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eqiora-python-candidate-metadata
          path: ${{ runner.temp }}/candidate-metadata/*
          if-no-files-found: error
          retention-days: 30

  publish_testpypi:
    name: Publish exact bytes to TestPyPI
    needs: finalize-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/eqiora/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download accepted distribution bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eqiora-python-finalized-family
          path: candidate-dist
      - name: Trusted publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: candidate-dist
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          verbose: true

  replay_download:
    name: Reacquire and hash TestPyPI bytes
    needs: [finalize-candidate, publish_testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install candidate-manifest validation tooling
        run: |
          python -m pip install --only-binary=:all: "packaging==24.0"
      - name: Download retained finalized distribution family
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eqiora-python-finalized-family
          path: candidate-family
      - name: Download candidate metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eqiora-python-candidate-metadata
          path: candidate-manifest
      - name: Download exact TestPyPI version and compare every hash
        env:
          MANIFEST_SHA256: ${{ needs.finalize-candidate.outputs.manifest_sha256 }}
        run: |
          mapfile -t metadata < <(find candidate-manifest -maxdepth 1 -type f)
          mapfile -t manifests < <(find candidate-manifest -maxdepth 1 -type f -name '*-python-candidate.json')
          test "${#metadata[@]}" -eq 1
          test "${#manifests[@]}" -eq 1
          python3 tools/release/testpypi_replay.py \
            --manifest "${manifests[0]}" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --artifacts candidate-family \
            --out "$RUNNER_TEMP/testpypi-dist"
      - name: Retain exact TestPyPI replay bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eqiora-testpypi-replay-dists
          path: ${{ runner.temp }}/testpypi-dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  replay_base:
    name: TestPyPI CPython ${{ matrix.python }}
    needs: replay_download
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out smoke-test source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Set up supported CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install candidate-manifest validation tooling
        run: |
          python -m pip install --only-binary=:all: "packaging==24.0"
      - name: Download TestPyPI-accepted bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eqiora-testpypi-replay-dists
          path: testpypi-dist
      - name: Install local exact wheel with dependencies from production PyPI
        run: |
          mapfile -t wheels < <(find testpypi-dist -maxdepth 1 -type f -name "eqiora-*-cp311-abi3-*.whl")
          test "${#wheels[@]}" -eq 1
          python -m pip install \
            --disable-pip-version-check \
            --index-url https://pypi.org/simple \
            --only-binary=:all: \
            "${wheels[0]}"
      - name: Resolve the admitted candidate version
        run: |
          CANDIDATE_VERSION="$(PYTHONPATH=tools/release python3 -c 'from python_candidate import load_config; print(load_config().python_version)')"
          echo "CANDIDATE_VERSION=$CANDIDATE_VERSION" >> "$GITHUB_ENV"
      - name: Run installed public quick start outside the checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -I "$GITHUB_WORKSPACE/tools/release/python_public_smoke.py"
          --expected-version "$CANDIDATE_VERSION"
          --profile base

  replay_frameworks:
    name: TestPyPI ${{ matrix.profile }} quick start
    needs: replay_download
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [torch, jax]
    steps:
      - name: Check out smoke-test source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Set up the exact framework interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install candidate-manifest validation tooling
        run: |
          python -m pip install --only-binary=:all: "packaging==24.0"
      - name: Download TestPyPI-accepted bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eqiora-testpypi-replay-dists
          path: testpypi-dist
      - name: Install exact wheel and selected extra from production PyPI
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          mapfile -t wheels < <(find testpypi-dist -maxdepth 1 -type f -name 'eqiora-*-cp311-abi3-*.whl')
          test "${#wheels[@]}" -eq 1
          python -m pip install \
            --disable-pip-version-check \
            --index-url https://pypi.org/simple \
            --only-binary=:all: \
            "${wheels[0]}[$PROFILE]"
      - name: Resolve the admitted candidate version
        run: |
          CANDIDATE_VERSION="$(PYTHONPATH=tools/release python3 -c 'from python_candidate import load_config; print(load_config().python_version)')"
          echo "CANDIDATE_VERSION=$CANDIDATE_VERSION" >> "$GITHUB_ENV"
      - name: Run installed framework quick start outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          PROFILE: ${{ matrix.profile }}
        run: >-
          python -I "$GITHUB_WORKSPACE/tools/release/python_public_smoke.py"
          --expected-version "$CANDIDATE_VERSION"
          --profile "$PROFILE"
