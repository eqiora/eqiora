name: Documentation site
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read
concurrency:
  group: pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}
jobs:
  build:
    name: Build and verify static documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      full_build: ${{ steps.site_closure.outputs.site }}
      source_sha: ${{ steps.site_closure.outputs.site_source_sha }}
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      LC_ALL: C
      TZ: UTC
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Authenticate successful documentation work on the previous PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_PREVIOUS_SHA: ${{ github.event.action == 'edited' && github.event.pull_request.head.sha || github.event.before }}
          SITE_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SITE_REPOSITORY: ${{ github.repository }}
          SITE_EVENT_NAME: ${{ github.event_name }}
        run: |
          attestation="$RUNNER_TEMP/eqiora-previous-pages.json"
          reuse_mode=()
          if [ "$SITE_EVENT_NAME" = push ]; then
            reuse_mode=(--deployed-pages)
          fi
          python3 tools/ci/authenticate_previous_run.py \
            --repository "$SITE_REPOSITORY" \
            --pull-request "${SITE_PULL_REQUEST:-0}" \
            --previous-sha "$SITE_PREVIOUS_SHA" \
            --workflow pages.yml \
            "${reuse_mode[@]}" \
            --output "$attestation"
          if [ "$SITE_EVENT_NAME" = push ]; then
            SITE_PREVIOUS_SHA="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("previous_sha", ""))' "$attestation")"
          fi
          {
            printf 'EQIORA_PREVIOUS_SHA=%s\n' "$SITE_PREVIOUS_SHA"
            printf 'EQIORA_REUSE_ATTESTATION=%s\n' "$attestation"
            printf 'EQIORA_REUSE_WORKFLOW=pages.yml\n'
          } >> "$GITHUB_ENV"
          if printf '%s' "$SITE_PREVIOUS_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            git fetch --no-tags --no-recurse-submodules --no-write-fetch-head \
              origin "$SITE_PREVIOUS_SHA" || true
          fi
      - name: Classify the complete documentation input closure
        id: site_closure
        env:
          SITE_EVENT_NAME: ${{ github.event_name }}
          SITE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SITE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          exec python3 tools/ci/classify_changes.py \
            --event "$SITE_EVENT_NAME" \
            --base "$SITE_BASE_SHA" \
            --head "$SITE_HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Summarize the exact documentation decision
        env:
          SITE_RUN: ${{ steps.site_closure.outputs.site }}
          SITE_REASON: ${{ steps.site_closure.outputs.site_reason }}
          SITE_SOURCE_SHA: ${{ steps.site_closure.outputs.site_source_sha }}
        run: |
          printf -- '- site: run=%s — %s (content authority %s)\n' \
            "$SITE_RUN" "$SITE_REASON" "$SITE_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Bind the classified source authority
        env:
          SITE_SOURCE_SHA: ${{ steps.site_closure.outputs.site_source_sha }}
        run: |
          test -n "$SITE_SOURCE_SHA"
          printf 'EQIORA_SITE_SOURCE_SHA=%s\n' "$SITE_SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Complete the unchanged input closure
        if: steps.site_closure.outputs.site == 'false'
        env:
          SITE_REASON: ${{ steps.site_closure.outputs.site_reason }}
          SITE_SOURCE_SHA: ${{ steps.site_closure.outputs.site_source_sha }}
        run: |
          test -n "$SITE_REASON"
          printf 'Documentation Site: %s (content authority %s)\n' \
            "$SITE_REASON" "$SITE_SOURCE_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Configure GitHub Pages
        if: steps.site_closure.outputs.site == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Bind exact temporary supply roots
        if: steps.site_closure.outputs.site == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP"
          test ! -L "$RUNNER_TEMP"
          {
            echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/eqiora-pw-1.62.1-r1234"
          } >> "$GITHUB_ENV"
      - name: Restore the exact Playwright browser cache
        if: steps.site_closure.outputs.site == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: eqiora-site-${{ runner.os }}-${{ runner.arch }}-playwright-1.62.1-r1234-${{ hashFiles('docs/site/package-lock.json') }}
      - name: Install the locked mise toolchain
        if: steps.site_closure.outputs.site == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.5.10
          # Rust toolchains live in rustup's home, outside mise's cache. Restoring
          # mise's install metadata alone can therefore create a dangling
          # "installed" toolchain. Install the locked tools as one fresh unit.
          cache: false
      - name: Prepare the exact clean source and unique home-backed scratch
        if: steps.site_closure.outputs.site == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -d "$RUNNER_TEMP"
          test ! -L "$RUNNER_TEMP"
          scratch="$(mktemp -d "$RUNNER_TEMP/eqiora-site.XXXXXXXX")"
          test ! -L "$scratch"
          test "$(stat -c %a -- "$scratch")" = "700"
          scratch_device="$(stat -c %d -- "$scratch")"
          scratch_inode="$(stat -c %i -- "$scratch")"
          scratch="$(realpath "$scratch")"
          case "$scratch" in
            "$RUNNER_TEMP"/eqiora-site.*) ;;
            *) echo "site scratch escaped RUNNER_TEMP" >&2; exit 1 ;;
          esac
          mkdir "$scratch/source" "$scratch/build"
          git ls-tree -r "$GITHUB_SHA" > "$scratch/source-tree"
          source_links="$(awk '$1 == "120000" { print $4 }' "$scratch/source-tree")"
          case "$source_links" in
            ''|'CLAUDE.md') ;;
            *) echo "source tree has unadmitted links: $source_links" >&2; exit 1 ;;
          esac
          if test -n "$source_links"; then
            test "$(git cat-file blob "$GITHUB_SHA:CLAUDE.md" | sha256sum | cut -d ' ' -f 1)" = "a54ff182c7e8acf56acfd6e4b9c3ff41e2c41a31c9b211b2deb9df75d9a478f9"
            git ls-tree "$GITHUB_SHA" -- AGENTS.md | grep -F '100644 blob'
            git cat-file blob "$GITHUB_SHA:AGENTS.md" > "$scratch/expected-AGENTS.md"
          fi
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$scratch/source"
          if test -n "$source_links"; then
            test -L "$scratch/source/CLAUDE.md"
            if test -L "$scratch/source/CLAUDE.md"; then
              :
            else
              exit 1
            fi
            test "$(readlink -n "$scratch/source/CLAUDE.md" | sha256sum | cut -d ' ' -f 1)" = "a54ff182c7e8acf56acfd6e4b9c3ff41e2c41a31c9b211b2deb9df75d9a478f9"
            cmp "$scratch/source/AGENTS.md" "$scratch/expected-AGENTS.md"
          elif test -e "$scratch/source/CLAUDE.md" || test -L "$scratch/source/CLAUDE.md"; then
            exit 1
          fi
          rm -f "$scratch/source-tree" "$scratch/expected-AGENTS.md"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$GITHUB_SHA^{tree}")"

          {
            echo "EQIORA_API_SCRATCH=$scratch"
            echo "EQIORA_SITE_SOURCE_ROOT=$scratch/source"
            echo "EQIORA_SITE_ASTRO_OUT_DIR=$scratch/astro"
            echo "EQIORA_SITE_CARGO_TARGET=$scratch/cargo-target"
            echo "EQIORA_SITE_RUSTDOC_TARGET=$scratch/rustdoc-target"
            echo "EQIORA_SITE_RUSTDOC_STAGE=$scratch/rustdoc-stage"
            echo "EQIORA_SITE_ARTIFACT=$scratch/build/site"
            echo "EQIORA_RUNNER_UID=$(id -u)"
            echo "EQIORA_RUNNER_GID=$(id -g)"
            echo "EQIORA_RUNNER_HOME=$HOME"
            echo "EQIORA_RUNNER_PATH=$PATH"
            echo "EQIORA_SITE_SCRATCH_DEVICE=$scratch_device"
            echo "EQIORA_SITE_SCRATCH_INODE=$scratch_inode"
          } >> "$GITHUB_ENV"
      - name: Supply locked native, Rust, Python, Node, and browser inputs
        if: steps.site_closure.outputs.site == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mise install
          test "$(node --version)" = "v24.18.1"
          test "$(npm --version)" = "11.16.0"
          test "$(python3 --version)" = "Python 3.13.14"
          test "$(uv --version)" = "uv 0.12.1 (x86_64-unknown-linux-musl)"
          test "$(rustc -Vv)" = "$(rustc +stable -Vv)"
          test "$(uname -m)" = "x86_64"
          node --version
          npm --version
          python3 --version
          uv --version
          cargo +stable --version
          rustc +stable -Vv

          # Pages uses the pinned Playwright browser, not the runner's Chrome feed.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            test -f "$source" || continue
            if sudo grep -Eq 'https?://dl\.google\.com/linux/chrome(-stable)?/deb/?([[:space:]]|$)' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libclang-dev libffi-dev libopenmpi-dev openmpi-bin

          npm ci --engine-strict --prefix docs/site
          node <<'NODE'
          const browsers = require('./docs/site/node_modules/playwright-core/browsers.json');
          for (const name of ['chromium', 'chromium-headless-shell']) {
            const browser = browsers.browsers.find((entry) => entry.name === name);
            if (!browser || browser.revision !== '1234' || browser.browserVersion !== '151.0.7922.34') {
              throw new Error(`unexpected ${name} identity: ${JSON.stringify(browser)}`);
            }
          }
          NODE
          npx --prefix docs/site playwright install --with-deps chromium

          cargo +stable fetch --locked

          browser_path="$({ cd docs/site; node --input-type=module -e \
            "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())"; })"
          case "$browser_path" in
            "$PLAYWRIGHT_BROWSERS_PATH"/*) ;;
            *) echo "Playwright executable escaped the named cache" >&2; exit 1 ;;
          esac
          test "$browser_path" = "$PLAYWRIGHT_BROWSERS_PATH/chromium-1234/chrome-linux64/chrome"
          test -x "$browser_path"
          expected_browser_sha256="0b20b130e7edd9dd51873be867761295fe0cfad490c2b9a64f95bd3cfc08fa71"
          expected_browser_bytes="290614600"
          expected_browser_version_hex="476f6f676c65204368726f6d6520666f722054657374696e67203135312e302e373932322e3334200a"
          browser_sha256="$(sha256sum "$browser_path" | cut -d ' ' -f 1)"
          browser_bytes="$(stat -c %s "$browser_path")"
          test "$browser_sha256" = "$expected_browser_sha256"
          test "$browser_bytes" = "$expected_browser_bytes"
          EQIORA_SITE_BROWSER_SHA256="$expected_browser_sha256"
          EQIORA_SITE_BROWSER_BYTES="$expected_browser_bytes"
          export EQIORA_SITE_BROWSER_SHA256 EQIORA_SITE_BROWSER_BYTES
          python3 tools/site/check_site.py browser-supply \
            --site-root docs/site \
            --browser-cache "$PLAYWRIGHT_BROWSERS_PATH" \
            --expected-executable-sha256 "$EQIORA_SITE_BROWSER_SHA256" \
            --expected-executable-bytes "$EQIORA_SITE_BROWSER_BYTES"
          version_hex="$("$browser_path" --version | od -An -tx1 | tr -d '[:space:]')"
          test "$version_hex" = "$expected_browser_version_hex"
          find "$PLAYWRIGHT_BROWSERS_PATH" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/eqiora-site-browser-sha256.txt"
          find "$PLAYWRIGHT_BROWSERS_PATH" -type f -print0 | sort -z \
            | xargs -0 stat --printf='%s\t%n\n' \
            > "$RUNNER_TEMP/eqiora-site-browser-sizes.txt"
          cat "$RUNNER_TEMP/eqiora-site-browser-sha256.txt"
          cat "$RUNNER_TEMP/eqiora-site-browser-sizes.txt"
          sha256sum docs/site/package.json docs/site/package-lock.json \
            mise.toml mise.lock rust-toolchain.toml .cargo/config.toml uv.lock \
            > "$RUNNER_TEMP/eqiora-site-input-sha256.before"
          cat "$RUNNER_TEMP/eqiora-site-input-sha256.before"
          dpkg-query -W -f='${Package}\t${Version}\n' | sort \
            > "$RUNNER_TEMP/eqiora-site-dpkg-versions.txt"
          cat "$RUNNER_TEMP/eqiora-site-dpkg-versions.txt"
          printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unset}" "${ImageVersion:-unset}"
          uname -a
          rustc -Vv
          git fetch --no-tags --no-recurse-submodules --no-write-fetch-head \
            origin refs/pull/501/head
          mv docs/site/node_modules "$EQIORA_SITE_SOURCE_ROOT/docs/site/node_modules"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$GITHUB_SHA^{tree}")"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          for object in 5d2a9bef58c2df32cd6b14c5b6dd876beac7144f 3237f739098498ac46bfdd6a993c00b0575900f3 57f8b9b476c04b8103b5a43c8a30504c0e2fa1fb 47dc3e3d863cfb5727b87d785d09abf9743c0a72 61c1bbede492aef4a9c85fa364d031e012621809 68c9c2fe245ac52cc20dcf5a65a2455de507f0dc 20701fe8909295b980c1da7cf3eab366f8d5f27c 6e685495bf6989e1ad902a7e88c199557285cbee 19968da984c16e718baeb9faa5aae04260896c29 1d19473c487b8035608cc88cbd99757f2b95865a 21d5f0bc5213bca02336040f1085c7d52c63588f 47dc3e3d863cfb5727b87d785d09abf9743c0a72 61c1bbede492aef4a9c85fa364d031e012621809; do git cat-file -e "$object"; done
          { echo "EQIORA_SITE_GIT_OBJECT_REPOSITORY=$GITHUB_WORKSPACE"; } >> "$GITHUB_ENV"
          {
            echo "EQIORA_SITE_BROWSER_SHA256=$EQIORA_SITE_BROWSER_SHA256"
            echo "EQIORA_SITE_BROWSER_BYTES=$EQIORA_SITE_BROWSER_BYTES"
          } >> "$GITHUB_ENV"
      - name: Build and verify with only loopback networking
        if: steps.site_closure.outputs.site == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -x "$EQIORA_SITE_SOURCE_ROOT/tools/site/run_offline_site_checks.sh"
          sudo --preserve-env=ASTRO_TELEMETRY_DISABLED,EQIORA_API_SCRATCH,EQIORA_SITE_SOURCE_ROOT,EQIORA_SITE_GIT_OBJECT_REPOSITORY,EQIORA_SITE_ASTRO_OUT_DIR,EQIORA_SITE_CARGO_TARGET,EQIORA_SITE_RUSTDOC_TARGET,EQIORA_SITE_RUSTDOC_STAGE,EQIORA_SITE_ARTIFACT,EQIORA_SITE_SOURCE_SHA,EQIORA_SITE_BROWSER_SHA256,EQIORA_SITE_BROWSER_BYTES,EQIORA_RUNNER_UID,EQIORA_RUNNER_GID,EQIORA_RUNNER_HOME,EQIORA_RUNNER_PATH,PLAYWRIGHT_BROWSERS_PATH,LC_ALL,TZ \
            unshare --net -- bash -ceu '
              ip link set lo up
              exec setpriv \
                --reuid "$EQIORA_RUNNER_UID" \
                --regid "$EQIORA_RUNNER_GID" \
                --clear-groups \
                -- env \
                  --chdir="$EQIORA_SITE_SOURCE_ROOT" \
                  MISE_TRUSTED_CONFIG_PATHS="$EQIORA_SITE_SOURCE_ROOT/mise.toml" \
                  HOME="$EQIORA_RUNNER_HOME" \
                  PATH="$EQIORA_RUNNER_PATH" \
                  LC_ALL="$LC_ALL" \
                  TZ="$TZ" \
                  ASTRO_TELEMETRY_DISABLED="$ASTRO_TELEMETRY_DISABLED" \
                  npm_config_offline=true \
                  CARGO_NET_OFFLINE=true \
                  PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
                  EQIORA_API_SCRATCH="$EQIORA_API_SCRATCH" \
                  EQIORA_SITE_SOURCE_ROOT="$EQIORA_SITE_SOURCE_ROOT" \
                  EQIORA_SITE_GIT_OBJECT_REPOSITORY="$EQIORA_SITE_GIT_OBJECT_REPOSITORY" \
                  EQIORA_SITE_ASTRO_OUT_DIR="$EQIORA_SITE_ASTRO_OUT_DIR" \
                  EQIORA_SITE_CARGO_TARGET="$EQIORA_SITE_CARGO_TARGET" \
                  EQIORA_SITE_RUSTDOC_TARGET="$EQIORA_SITE_RUSTDOC_TARGET" \
                  EQIORA_SITE_RUSTDOC_STAGE="$EQIORA_SITE_RUSTDOC_STAGE" \
                  EQIORA_SITE_ARTIFACT="$EQIORA_SITE_ARTIFACT" \
                  EQIORA_SITE_SOURCE_SHA="$EQIORA_SITE_SOURCE_SHA" \
                  EQIORA_SITE_BROWSER_SHA256="$EQIORA_SITE_BROWSER_SHA256" \
                  EQIORA_SITE_BROWSER_BYTES="$EQIORA_SITE_BROWSER_BYTES" \
                  "$EQIORA_SITE_SOURCE_ROOT/tools/site/run_offline_site_checks.sh"
            '
      - name: Recheck exact inputs and checked artifact
        if: steps.site_closure.outputs.site == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$GITHUB_SHA^{tree}")"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          for object in 5d2a9bef58c2df32cd6b14c5b6dd876beac7144f 3237f739098498ac46bfdd6a993c00b0575900f3 57f8b9b476c04b8103b5a43c8a30504c0e2fa1fb 47dc3e3d863cfb5727b87d785d09abf9743c0a72 61c1bbede492aef4a9c85fa364d031e012621809 68c9c2fe245ac52cc20dcf5a65a2455de507f0dc 20701fe8909295b980c1da7cf3eab366f8d5f27c 6e685495bf6989e1ad902a7e88c199557285cbee 19968da984c16e718baeb9faa5aae04260896c29 1d19473c487b8035608cc88cbd99757f2b95865a 21d5f0bc5213bca02336040f1085c7d52c63588f 47dc3e3d863cfb5727b87d785d09abf9743c0a72 61c1bbede492aef4a9c85fa364d031e012621809; do git cat-file -e "$object"; done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f "$EQIORA_SITE_ARTIFACT/index.html"
          test -f "$EQIORA_SITE_ARTIFACT/pagefind/pagefind.js"
          test -f "$EQIORA_SITE_ARTIFACT/reference/rust/api/eqiora/index.html"
          test ! -e "$EQIORA_SITE_ARTIFACT/reference/control-v2"
          test ! -e "$EQIORA_SITE_ARTIFACT/reference/mcp"
          sha256sum docs/site/package.json docs/site/package-lock.json \
            mise.toml mise.lock rust-toolchain.toml .cargo/config.toml uv.lock \
            > "$RUNNER_TEMP/eqiora-site-input-sha256.after"
          cmp --silent \
            "$RUNNER_TEMP/eqiora-site-input-sha256.before" \
            "$RUNNER_TEMP/eqiora-site-input-sha256.after"
          sha256sum .github/workflows/pages.yml
          find "$EQIORA_SITE_ARTIFACT" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/eqiora-site-artifact-sha256.txt"
          sha256sum "$RUNNER_TEMP/eqiora-site-artifact-sha256.txt"

      - name: Upload GitHub Pages artifact
        if: steps.site_closure.outputs.site == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.EQIORA_SITE_ARTIFACT }}

      - name: Retain an authenticated empty site scratch for runner teardown
        if: always() && steps.site_closure.outputs.site == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import secrets
          import stat
          from pathlib import Path

          ARTIFACT_MANIFEST = "eqiora-site-artifact-sha256.txt"
          RECEIPT = "eqiora-site-cleanup-receipt.json"
          RECEIPT_SCHEMA = "eqiora.site.scratch-cleanup-receipt/v1"

          def identity(details):
              return (details.st_dev, details.st_ino)

          def write_all(file_descriptor, contents):
              remaining = memoryview(contents)
              while remaining:
                  written = os.write(file_descriptor, remaining)
                  if written <= 0:
                      raise OSError("short cleanup receipt write")
                  remaining = remaining[written:]

          def canonical_decimal(name):
              value = os.environ.get(name, "")
              if (
                  not value
                  or not value.isascii()
                  or not value.isdecimal()
                  or str(int(value)) != value
              ):
                  raise SystemExit(f"missing or noncanonical {name} receipt")
              return int(value)

          def clear_directory(directory_fd, scratch_device):
              operations = 0
              for name in sorted(os.listdir(directory_fd)):
                  details = os.stat(name, dir_fd=directory_fd, follow_symlinks=False)
                  if not stat.S_ISDIR(details.st_mode):
                      os.unlink(name, dir_fd=directory_fd)
                      operations += 1
                      continue
                  if details.st_dev != scratch_device:
                      raise SystemExit(f"refusing cross-device site scratch child: {name}")
                  child_fd = os.open(
                      name,
                      os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,
                      dir_fd=directory_fd,
                  )
                  try:
                      opened = os.fstat(child_fd)
                      if identity(opened) != identity(details):
                          raise SystemExit(f"directory identity changed during cleanup: {name}")
                      if opened.st_dev != scratch_device:
                          raise SystemExit(f"refusing cross-device site scratch child: {name}")
                      operations += clear_directory(child_fd, scratch_device)
                      current = os.stat(name, dir_fd=directory_fd, follow_symlinks=False)
                      if identity(current) != identity(opened):
                          raise SystemExit(f"directory entry changed during cleanup: {name}")
                      os.rmdir(name, dir_fd=directory_fd)
                      operations += 1
                  finally:
                      os.close(child_fd)
              return operations

          def read_regular_file(parent_fd, name):
              observed = os.stat(name, dir_fd=parent_fd, follow_symlinks=False)
              if not stat.S_ISREG(observed.st_mode):
                  raise SystemExit(f"required cleanup input is not a regular file: {name}")
              file_fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW, dir_fd=parent_fd)
              try:
                  opened = os.fstat(file_fd)
                  if identity(opened) != identity(observed) or not stat.S_ISREG(opened.st_mode):
                      raise SystemExit(f"required cleanup input changed while opening: {name}")
                  chunks = []
                  while True:
                      chunk = os.read(file_fd, 1024 * 1024)
                      if not chunk:
                          break
                      chunks.append(chunk)
                  return b"".join(chunks)
              finally:
                  os.close(file_fd)

          def artifact_manifest_digest(parent_fd):
              manifest = read_regular_file(parent_fd, ARTIFACT_MANIFEST)
              try:
                  text = manifest.decode("utf-8")
              except UnicodeDecodeError as error:
                  raise SystemExit("artifact manifest is not UTF-8") from error
              lines = text.splitlines(keepends=True)
              if (
                  not lines
                  or any(not line.endswith("\n") or line.endswith("\r\n") for line in lines)
                  or any(
                      re.fullmatch(r"(?:\\)?[0-9a-f]{64} [ *].+\n", line) is None
                      for line in lines
                  )
              ):
                  raise SystemExit("artifact manifest is malformed")
              return hashlib.sha256(manifest).hexdigest()

          def write_receipt(parent_fd, receipt):
              encoded = (
                  json.dumps(receipt, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
                  + "\n"
              ).encode("utf-8")
              temporary = f".{RECEIPT}.{secrets.token_hex(16)}"
              temporary_fd = None
              installed_identity = None
              installed = False
              try:
                  temporary_fd = os.open(
                      temporary,
                      os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                      0o600,
                      dir_fd=parent_fd,
                  )
                  write_all(temporary_fd, encoded)
                  os.fsync(temporary_fd)
                  installed_identity = identity(os.fstat(temporary_fd))
                  os.close(temporary_fd)
                  temporary_fd = None
                  os.replace(
                      temporary,
                      RECEIPT,
                      src_dir_fd=parent_fd,
                      dst_dir_fd=parent_fd,
                  )
                  installed = True
                  try:
                      os.fsync(parent_fd)
                      write_all(1, encoded)
                  except BaseException:
                      try:
                          observed = os.stat(
                              RECEIPT,
                              dir_fd=parent_fd,
                              follow_symlinks=False,
                          )
                      except FileNotFoundError:
                          pass
                      else:
                          if identity(observed) != installed_identity:
                              raise RuntimeError(
                                  "installed cleanup receipt changed before rollback"
                              )
                          os.unlink(RECEIPT, dir_fd=parent_fd)
                      raise
              finally:
                  if temporary_fd is not None:
                      os.close(temporary_fd)
                  if not installed:
                      try:
                          os.unlink(temporary, dir_fd=parent_fd)
                      except FileNotFoundError:
                          pass

          candidate_text = os.environ.get("EQIORA_API_SCRATCH")
          runner_temp_text = os.environ.get("RUNNER_TEMP")
          device_text = os.environ.get("EQIORA_SITE_SCRATCH_DEVICE")
          inode_text = os.environ.get("EQIORA_SITE_SCRATCH_INODE")
          if not candidate_text and not device_text and not inode_text:
              if runner_temp_text and os.path.lexists(
                  os.path.join(runner_temp_text, ARTIFACT_MANIFEST)
              ):
                  raise SystemExit("normal site build has no scratch cleanup receipt")
              print("site scratch cleanup: not-created")
              raise SystemExit(0)
          if not candidate_text or not runner_temp_text or not device_text or not inode_text:
              raise SystemExit("partial site scratch cleanup receipt")
          candidate = Path(candidate_text)
          runner_temp = Path(runner_temp_text)
          if not candidate.is_absolute() or not runner_temp.is_absolute():
              raise SystemExit("refusing non-absolute site scratch cleanup")
          if candidate.parent != runner_temp or re.fullmatch(
              r"eqiora-site\.[A-Za-z0-9]{8}", candidate.name
          ) is None:
              raise SystemExit(f"refusing unsafe site scratch cleanup: {candidate}")
          expected_identity = (
              canonical_decimal("EQIORA_SITE_SCRATCH_DEVICE"),
              canonical_decimal("EQIORA_SITE_SCRATCH_INODE"),
          )

          runner_details = os.stat(runner_temp, follow_symlinks=False)
          if not stat.S_ISDIR(runner_details.st_mode):
              raise SystemExit(f"runner temp is not a real directory: {runner_temp}")
          runner_fd = os.open(runner_temp, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              if identity(os.fstat(runner_fd)) != identity(runner_details):
                  raise SystemExit(f"runner temp identity changed while opening: {runner_temp}")
              candidate_details = os.stat(candidate.name, dir_fd=runner_fd, follow_symlinks=False)
              if not stat.S_ISDIR(candidate_details.st_mode):
                  raise SystemExit(f"site scratch is not a real directory: {candidate}")
              if identity(candidate_details) != expected_identity:
                  raise SystemExit(f"site scratch identity changed: {candidate}")
              if stat.S_IMODE(candidate_details.st_mode) != 0o700:
                  raise SystemExit(f"site scratch mode changed: {candidate}")
              scratch_fd = os.open(
                  candidate.name,
                  os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,
                  dir_fd=runner_fd,
              )
              try:
                  opened = os.fstat(scratch_fd)
                  if identity(opened) != expected_identity:
                      raise SystemExit(f"opened site scratch identity changed: {candidate}")
                  if stat.S_IMODE(opened.st_mode) != 0o700:
                      raise SystemExit(f"opened site scratch mode changed: {candidate}")

                  operations = clear_directory(scratch_fd, expected_identity[0])
                  observed_entries = sorted(os.listdir(scratch_fd))
                  if observed_entries:
                      raise SystemExit(
                          "site scratch cleanup failed: stage=final-empty "
                          f"observed_entries={json.dumps(observed_entries[:32])}"
                      )
                  final_details = os.stat(
                      candidate.name,
                      dir_fd=runner_fd,
                      follow_symlinks=False,
                  )
                  if (
                      not stat.S_ISDIR(final_details.st_mode)
                      or identity(final_details) != expected_identity
                      or stat.S_IMODE(final_details.st_mode) != 0o700
                  ):
                      raise SystemExit(f"site scratch final identity changed: {candidate}")
                  confirmed_entries = sorted(os.listdir(scratch_fd))
                  if confirmed_entries:
                      raise SystemExit(
                          "site scratch cleanup failed: stage=final-confirmation "
                          f"observed_entries={json.dumps(confirmed_entries[:32])}"
                      )

                  source_revision = os.environ.get("GITHUB_SHA", "")
                  if re.fullmatch(r"[0-9a-f]{40}", source_revision) is None:
                      raise SystemExit("missing or malformed source revision")
                  manifest_sha256 = artifact_manifest_digest(runner_fd)
                  receipt = {
                      "artifact_manifest_sha256": manifest_sha256,
                      "candidate_basename": candidate.name,
                      "cleanup_disposition": "retained-empty-for-runner-teardown",
                      "descendant_operations": operations,
                      "final_destroy_observed": False,
                      "final_empty_observed": True,
                      "mode_octal": "0700",
                      "schema": RECEIPT_SCHEMA,
                      "source_revision": source_revision,
                      "scratch_device": expected_identity[0],
                      "scratch_inode": expected_identity[1],
                      "top_removal_attempted": False,
                  }
                  write_receipt(runner_fd, receipt)
              finally:
                  os.close(scratch_fd)
          finally:
              os.close(runner_fd)
          PY

  deploy:
    name: Deploy static documentation
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.full_build == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
