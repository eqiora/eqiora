name: CI

run-name: CI / ${{ github.event_name }} / ${{ github.event.pull_request.head.sha || inputs.commit }}

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit SHA to verify
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.commit }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  changes:
    name: Change ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target_sha: ${{ steps.classify.outputs.target_sha }}
      full: ${{ steps.classify.outputs.full }}
      rust: ${{ steps.classify.outputs.rust }}
      rust_reason: ${{ steps.classify.outputs.rust_reason }}
      msrv: ${{ steps.classify.outputs.msrv }}
      msrv_reason: ${{ steps.classify.outputs.msrv_reason }}
      python: ${{ steps.classify.outputs.python }}
      python_reason: ${{ steps.classify.outputs.python_reason }}
      studio: ${{ steps.classify.outputs.studio }}
      studio_reason: ${{ steps.classify.outputs.studio_reason }}
      dependency_policy: ${{ steps.classify.outputs.dependency_policy }}
      dependency_policy_reason: ${{ steps.classify.outputs.dependency_policy_reason }}
      cubecl_experiment: ${{ steps.classify.outputs.cubecl_experiment }}
      cubecl_experiment_reason: ${{ steps.classify.outputs.cubecl_experiment_reason }}
      python_versions: ${{ steps.classify.outputs.python_versions }}
    steps:
      - name: Bind manual source to the dispatch revision
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$SELECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SELECTED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.commit }}
          persist-credentials: false
      - name: Stage the checksum-pinned mise CLI
        shell: bash
        run: |
          mise_bin_dir="${RUNNER_TEMP:?}/eqiora-mise/bin"
          mise_bin="$mise_bin_dir/mise"
          mkdir -p "$mise_bin_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --output "$mise_bin" \
            https://github.com/jdx/mise/releases/download/v2026.5.10/mise-v2026.5.10-linux-x64
          printf '%s  %s\n' \
            568e6074262804788f138fb8749865738e47dff739ebaa0d428134c45957b569 \
            "$mise_bin" | sha256sum --check --strict
          chmod 0755 "$mise_bin"
          printf '%s\n' "$mise_bin_dir" >> "$GITHUB_PATH"
      - name: Test CI ownership and aggregate contracts
        env:
          EQIORA_CI_CONTRACT_ONLY: "1"
        run: python3 -m unittest discover -s tools/ci/tests -v
      - name: Authenticate successful heavy work on the previous PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_PREVIOUS_SHA: ${{ github.event.before }}
          CI_PULL_REQUEST: ${{ github.event.pull_request.number }}
          CI_REPOSITORY: ${{ github.repository }}
        run: |
          attestation="$RUNNER_TEMP/eqiora-previous-ci.json"
          python3 tools/ci/authenticate_previous_run.py \
            --repository "$CI_REPOSITORY" \
            --pull-request "${CI_PULL_REQUEST:-0}" \
            --previous-sha "$CI_PREVIOUS_SHA" \
            --workflow ci.yml \
            --output "$attestation"
          printf 'EQIORA_PREVIOUS_CI_ATTESTATION=%s\n' "$attestation" >> "$GITHUB_ENV"
          if printf '%s' "$CI_PREVIOUS_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            git fetch --no-tags --no-recurse-submodules --no-write-fetch-head \
              origin "$CI_PREVIOUS_SHA" || true
          fi
      - name: Classify exact change surface
        id: classify
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_REQUESTED_COMMIT: ${{ inputs.commit }}
          CI_PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          python3 tools/ci/classify_changes.py \
            --event "$CI_EVENT_NAME" \
            --base "$CI_BASE_SHA" \
            --head "$CI_HEAD_SHA" \
            --previous "$CI_PREVIOUS_SHA" \
            --reuse-attestation "$EQIORA_PREVIOUS_CI_ATTESTATION" \
            --workflow ci.yml \
            --requested-commit "$CI_REQUESTED_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Summarize exact lane decisions
        env:
          RUST_RUN: ${{ steps.classify.outputs.rust }}
          RUST_REASON: ${{ steps.classify.outputs.rust_reason }}
          MSRV_RUN: ${{ steps.classify.outputs.msrv }}
          MSRV_REASON: ${{ steps.classify.outputs.msrv_reason }}
          PYTHON_RUN: ${{ steps.classify.outputs.python }}
          PYTHON_REASON: ${{ steps.classify.outputs.python_reason }}
          STUDIO_RUN: ${{ steps.classify.outputs.studio }}
          STUDIO_REASON: ${{ steps.classify.outputs.studio_reason }}
          DEPENDENCY_RUN: ${{ steps.classify.outputs.dependency_policy }}
          DEPENDENCY_REASON: ${{ steps.classify.outputs.dependency_policy_reason }}
          CUBECL_RUN: ${{ steps.classify.outputs.cubecl_experiment }}
          CUBECL_REASON: ${{ steps.classify.outputs.cubecl_experiment_reason }}
        run: |
          {
            printf -- '- rust: run=%s — %s\n' "$RUST_RUN" "$RUST_REASON"
            printf -- '- msrv: run=%s — %s\n' "$MSRV_RUN" "$MSRV_REASON"
            printf -- '- python: run=%s — %s\n' "$PYTHON_RUN" "$PYTHON_REASON"
            printf -- '- studio: run=%s — %s\n' "$STUDIO_RUN" "$STUDIO_REASON"
            printf -- '- dependency_policy: run=%s — %s\n' "$DEPENDENCY_RUN" "$DEPENDENCY_REASON"
            printf -- '- cubecl_experiment: run=%s — %s\n' "$CUBECL_RUN" "$CUBECL_REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  documentation:
    name: Documentation contract
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.target_sha }}
          persist-credentials: false
      - name: Check local links and required entry points
        run: |
          python3 tools/ci/check_docs.py .
          python3 tools/ci/check_public_release_tree.py .

  quality:
    name: Stable quality gate
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Complete the unchanged input closure
        if: needs.changes.outputs.rust != 'true'
        env:
          TARGET_SHA: ${{ needs.changes.outputs.target_sha }}
          LANE_REASON: ${{ needs.changes.outputs.rust_reason }}
        run: |
          test -n "$TARGET_SHA"
          test -n "$LANE_REASON"
          printf 'Stable quality gate: %s; heavy execution did not run on %s.\n' \
            "$LANE_REASON" "$TARGET_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.rust == 'true'
        with:
          ref: ${{ needs.changes.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch frozen semantic-impact Cargo authority revision
        if: needs.changes.outputs.rust == 'true'
        run: git fetch --no-tags --depth=1 origin 8e9aec96d5170cb7ab7b7a5f52281e0a0ef09582
      - name: Install MPI build and runtime dependencies
        if: needs.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libopenmpi-dev openmpi-bin libclang-dev libffi-dev libglu1-mesa
          mpirun --version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.rust == 'true'
        with:
          python-version: "3.12"
      - name: Install the declared NumPy test floor
        if: needs.changes.outputs.rust == 'true'
        run: |
          requirement="$(
            python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["eqiora-distribution"]["tested-numpy-floor"])'
          )"
          python -m pip install --only-binary=:all: "gmsh==4.15.2" "$requirement"
          test "$(gmsh --version)" = "4.15.2"
      - name: Install stable Rust
        if: needs.changes.outputs.rust == 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Identify the native build environment
        if: needs.changes.outputs.rust == 'true'
        id: native
        run: |
          digest="$(dpkg-query -W | LC_ALL=C sort | sha256sum | cut -d ' ' -f 1)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Restore Stable dependencies
        if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: stable-deps-${{ steps.native.outputs.digest }}-${{ hashFiles('.github/workflows/ci.yml', 'Cargo.toml', 'tools/ci/rust_quality.py', 'pyproject.toml') }}
          env-vars: ImageOS ImageVersion pythonLocation Python_ROOT_DIR PKG_CONFIG LD_LIBRARY_PATH
          cmd-format: rustup run stable {0}
          workspaces: . -> target
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.changes.outputs.target_sha == github.sha }}
      - name: Preserve non-test incremental compilation
        if: needs.changes.outputs.rust == 'true'
        run: echo 'CARGO_INCREMENTAL=1' >> "$GITHUB_ENV"
      - name: Formatting
        if: needs.changes.outputs.rust == 'true'
        run: cargo +stable fmt --all -- --check
      - name: Clippy
        if: needs.changes.outputs.rust == 'true'
        run: python tools/ci/rust_quality.py clippy
      - name: Tests
        if: needs.changes.outputs.rust == 'true'
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_TEST_INCREMENTAL: "false"
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
          TMPDIR: ${{ runner.temp }}
        run: python tools/ci/rust_quality.py test
      - name: Full feature tests
        if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.full == 'true'
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_TEST_INCREMENTAL: "false"
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
          TMPDIR: ${{ runner.temp }}
        run: cargo +stable test --workspace --all-targets --all-features --locked --timings
      - name: Dependency layers
        if: needs.changes.outputs.rust == 'true'
        run: cargo +stable xtask check-layers
      - name: Public facade
        if: needs.changes.outputs.rust == 'true'
        run: cargo +stable xtask check-facade
      - name: Architecture predicates
        if: needs.changes.outputs.rust == 'true'
        run: cargo +stable xtask check-architecture
      - name: Documentation
        if: needs.changes.outputs.rust == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: python tools/ci/rust_quality.py doc

      - name: Retain Cargo build timings
        if: needs.changes.outputs.rust == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-build-timings-${{ needs.changes.outputs.target_sha }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: error
          retention-days: 7

  msrv:
    name: MSRV 1.89
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Complete the unchanged input closure
        if: needs.changes.outputs.msrv != 'true'
        env:
          TARGET_SHA: ${{ needs.changes.outputs.target_sha }}
          LANE_REASON: ${{ needs.changes.outputs.msrv_reason }}
        run: |
          test -n "$TARGET_SHA"
          test -n "$LANE_REASON"
          printf 'MSRV 1.89: %s; heavy execution did not run on %s.\n' \
            "$LANE_REASON" "$TARGET_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.msrv == 'true'
        with:
          ref: ${{ needs.changes.outputs.target_sha }}
          persist-credentials: false
      - name: Install optional-adapter build dependencies
        if: needs.changes.outputs.msrv == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libopenmpi-dev openmpi-bin libclang-dev libffi-dev
      - name: Install MSRV
        if: needs.changes.outputs.msrv == 'true'
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Check every production feature and target
        if: needs.changes.outputs.msrv == 'true'
        run: cargo +1.89.0 check --workspace --all-targets --all-features --locked

  dependency_policy:
    name: Dependency policy
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Complete the unchanged input closure
        if: needs.changes.outputs.dependency_policy != 'true'
        env:
          TARGET_SHA: ${{ needs.changes.outputs.target_sha }}
          LANE_REASON: ${{ needs.changes.outputs.dependency_policy_reason }}
        run: |
          test -n "$TARGET_SHA"
          test -n "$LANE_REASON"
          printf 'Dependency policy: %s; heavy execution did not run on %s.\n' \
            "$LANE_REASON" "$TARGET_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.dependency_policy == 'true'
        with:
          ref: ${{ needs.changes.outputs.target_sha }}
          persist-credentials: false
      - name: Check root dependency policy
        if: needs.changes.outputs.dependency_policy == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          arguments: --all-features --locked
          command: check
  cubecl_experiment:
    name: Isolated CubeCL contract experiment
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Complete the unchanged input closure
        if: needs.changes.outputs.cubecl_experiment != 'true'
        env:
          TARGET_SHA: ${{ needs.changes.outputs.target_sha }}
          LANE_REASON: ${{ needs.changes.outputs.cubecl_experiment_reason }}
        run: |
          test -n "$TARGET_SHA"
          test -n "$LANE_REASON"
          printf 'Isolated CubeCL contract experiment: %s; heavy execution did not run on %s.\n' \
            "$LANE_REASON" "$TARGET_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.cubecl_experiment == 'true'
        with:
          ref: ${{ needs.changes.outputs.target_sha }}
          persist-credentials: false
      - name: Install latest stable Rust
        if: needs.changes.outputs.cubecl_experiment == 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Formatting
        if: needs.changes.outputs.cubecl_experiment == 'true'
        run: cargo +stable fmt --manifest-path experiments/cubecl-local-action/Cargo.toml -- --check
      - name: Clippy
        if: needs.changes.outputs.cubecl_experiment == 'true'
        run: cargo +stable clippy --manifest-path experiments/cubecl-local-action/Cargo.toml --locked --all-targets -- -D warnings
      - name: Device-independent contract tests
        if: needs.changes.outputs.cubecl_experiment == 'true'
        run: cargo +stable test --manifest-path experiments/cubecl-local-action/Cargo.toml --locked

  python_wheel:
    name: Python ${{ matrix.python }} installed wheel
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.python_versions) }}
    steps:
      - name: Complete the unchanged input closure
        if: needs.changes.outputs.python != 'true'
        env:
          TARGET_SHA: ${{ needs.changes.outputs.target_sha }}
          LANE_REASON: ${{ needs.changes.outputs.python_reason }}
        run: |
          test -n "$TARGET_SHA"
          test -n "$LANE_REASON"
          printf 'Python %s installed wheel: %s; heavy execution did not run on %s.\n' \
            '${{ matrix.python }}' "$LANE_REASON" "$TARGET_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.python == 'true'
        with:
          ref: ${{ needs.changes.outputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.python == 'true'
        with:
          python-version: ${{ matrix.python }}
      - name: Install Gmsh native runtime dependency
        if: needs.changes.outputs.python == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libglu1-mesa
      - name: Install stable Rust
        if: needs.changes.outputs.python == 'true'
        run: rustup toolchain install stable --profile minimal
      - name: Test installed wheel
        if: needs.changes.outputs.python == 'true'
        run: python tools/ci/python_package_gate.py

  studio:
    name: Studio browser projection
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Complete the unchanged input closure
        if: needs.changes.outputs.studio != 'true'
        env:
          TARGET_SHA: ${{ needs.changes.outputs.target_sha }}
          LANE_REASON: ${{ needs.changes.outputs.studio_reason }}
        run: |
          test -n "$TARGET_SHA"
          test -n "$LANE_REASON"
          printf 'Studio browser projection: %s; heavy execution did not run on %s.\n' \
            "$LANE_REASON" "$TARGET_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.studio == 'true'
        with:
          ref: ${{ needs.changes.outputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.changes.outputs.studio == 'true'
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install locked frontend dependencies
        if: needs.changes.outputs.studio == 'true'
        working-directory: studio
        run: npm ci
      - name: Frontend quality and unit tests
        if: needs.changes.outputs.studio == 'true'
        working-directory: studio
        run: |
          npm run check
          npm test
          npm run build
      - name: Accessible interaction tests
        if: needs.changes.outputs.studio == 'true'
        working-directory: studio
        run: npm run test:e2e

  gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - documentation
      - quality
      - msrv
      - dependency_policy
      - cubecl_experiment
      - python_wheel
      - studio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.target_sha || github.sha }}
          persist-credentials: false
      - name: Require every relevant result
        env:
          CI_RELEVANCE: >-
            {"rust":"${{ needs.changes.outputs.rust }}",
             "msrv":"${{ needs.changes.outputs.msrv }}",
             "python":"${{ needs.changes.outputs.python }}",
             "studio":"${{ needs.changes.outputs.studio }}",
             "dependency_policy":"${{ needs.changes.outputs.dependency_policy }}",
             "cubecl_experiment":"${{ needs.changes.outputs.cubecl_experiment }}"}
          CI_RESULTS: >-
            {"changes":"${{ needs.changes.result }}",
             "documentation":"${{ needs.documentation.result }}",
             "quality":"${{ needs.quality.result }}",
             "msrv":"${{ needs.msrv.result }}",
             "dependency_policy":"${{ needs.dependency_policy.result }}",
             "cubecl_experiment":"${{ needs.cubecl_experiment.result }}",
             "python_wheel":"${{ needs.python_wheel.result }}",
             "studio":"${{ needs.studio.result }}"}
        run: python3 tools/ci/check_gate.py
