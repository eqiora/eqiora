name: Production publish

run-name: Production publish / ${{ inputs.tag }} / candidate ${{ inputs.candidate_run_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact annotated public release tag
        required: true
        type: string
      commit:
        description: Exact public source commit
        required: true
        type: string
      candidate_run_id:
        description: Accepted Python release-candidate workflow run ID
        required: true
        type: string
      manifest_sha256:
        description: Approved candidate manifest SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: python-production-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Bind tag to the accepted candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Bind publication authority to protected main
        env:
          SELECTED_COMMIT: ${{ inputs.commit }}
          SELECTED_TAG: ${{ inputs.tag }}
        run: |
          [[ "$SELECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test -n "$SELECTED_TAG"
          test "$GITHUB_REF" = "refs/heads/main"
      - name: Check out protected publication authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retain the trusted candidate-run validator
        run: install -m 0555 tools/release/validate_candidate_run.py "$RUNNER_TEMP/validate_candidate_run.py"
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install candidate-manifest validation tooling
        run: |
          python -m pip install --only-binary=:all: "packaging==24.0"
      - name: Require exact annotated tag and source commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          test "$(git cat-file -t "$tag_object")" = "tag"
          peeled_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          test "$(git cat-file -t "$peeled_commit")" = "commit"
          test "$peeled_commit" = "$RELEASE_COMMIT"
          CANDIDATE_VERSION="$(PYTHONPATH=tools/release python3 -c 'from python_candidate import load_config; print(load_config().python_version)')"
          test "$RELEASE_TAG" = "v$CANDIDATE_VERSION"
      - name: Authenticate the completed candidate workflow run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: >-
          python3 "$RUNNER_TEMP/validate_candidate_run.py"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$CANDIDATE_RUN_ID"
          --expected-commit "$RELEASE_COMMIT"
          --expected-tag "${{ inputs.tag }}"
      - name: Download exact candidate distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eqiora-python-finalized-family
          path: candidate-dist
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact candidate metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eqiora-python-candidate-metadata
          path: candidate-manifest
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify approved manifest, source, tag, and every artifact hash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          mapfile -t metadata < <(find candidate-manifest -maxdepth 1 -type f)
          mapfile -t manifests < <(find candidate-manifest -maxdepth 1 -type f -name '*-python-candidate.json')
          test "${#metadata[@]}" -eq 1
          test "${#manifests[@]}" -eq 1
          python3 tools/release/candidate_manifest.py \
            --manifest "${manifests[0]}" \
            --artifacts candidate-dist \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --expected-commit "$RELEASE_COMMIT" \
            --expected-tag "$RELEASE_TAG"

  publish:
    name: Trusted publish exact bytes to PyPI
    needs: [verify, prepare_rust]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/eqiora/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download the same accepted candidate distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eqiora-python-finalized-family
          path: candidate-dist
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Trusted publish to production PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: candidate-dist
          print-hash: true
          verbose: true

  prepare_rust:
    name: Verify Rust source archives from the accepted commit
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the accepted release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the locked Linux Rust toolchain
        run: |
          toolchain="$(PYTHONPATH=tools/release python3 -c 'from pathlib import Path; from rust_publish import locked_toolchain; print(locked_toolchain(Path.cwd()))')"
          rustup toolchain install "$toolchain" --profile minimal
      - name: Package and build the complete Rust publication closure
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: >-
          python3 tools/release/rust_publish.py prepare
          --commit "$RELEASE_COMMIT"
          --artifacts "$HOME/.cache/eqiora-rust-artifacts"
      - name: Retain the verified Cargo archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eqiora-rust-crates
          path: ~/.cache/eqiora-rust-artifacts/*.crate
          if-no-files-found: error

  publish_rust:
    name: Publish verified Rust archives to crates.io
    needs: prepare_rust
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: crates-io
      url: https://crates.io/crates/eqiora
    permissions:
      contents: read
    steps:
      - name: Check out the accepted release commit on a fresh runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the same locked Linux Rust toolchain
        run: |
          toolchain="$(PYTHONPATH=tools/release python3 -c 'from pathlib import Path; from rust_publish import locked_toolchain; print(locked_toolchain(Path.cwd()))')"
          rustup toolchain install "$toolchain" --profile minimal
      - name: Download this run's verified Cargo archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eqiora-rust-crates
          path: ~/.cache/eqiora-rust-artifacts
      - name: Reconstruct and compare archives without executing build scripts
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: >-
          python3 tools/release/rust_publish.py validate
          --commit "$RELEASE_COMMIT"
          --artifacts "$HOME/.cache/eqiora-rust-artifacts"
      - name: Publish in dependency order and resume only identical versions
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: >-
          python3 tools/release/rust_publish.py publish
          --commit "$RELEASE_COMMIT"
          --artifacts "$HOME/.cache/eqiora-rust-artifacts"
