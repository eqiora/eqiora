min_version = "2026.5.10"

[settings]
locked = true

# mise owns developer-tool installation and required gate/setup orchestration.
# Language and application dependencies remain owned by Cargo.lock, uv.lock,
# and the Studio package-lock.json; local_verify.py owns the acceptance plan.
[tools]
rust = [
  { version = "stable", profile = "default", components = ["rustfmt", "clippy"] },
  { version = "1.97.1-x86_64-unknown-linux-gnu", profile = "default", components = ["rustfmt", "clippy"], os = ["linux/x64"] },
]
python = "3.13.14"
node = "24.18.1"
npm = "11.16.0"
uv = "0.13.6"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.setup]
description = "Install locked Studio dependencies before executable gates and Studio tasks"
dir = "{{config_root}}/studio"
sources = [
  "{{config_root}}/mise.toml",
  "{{config_root}}/mise.lock",
  "{{config_root}}/studio/package.json",
  "{{config_root}}/studio/package-lock.json",
]
outputs = ["{{config_root}}/studio/node_modules/.package-lock.json"]
run = "npm ci"

[tasks.plan]
description = "Print the setup-free affected verification plan without executing it"
run = "python3 tools/ci/local_verify.py affected --base origin/main --plan"

[tasks.pr]
description = "Run the light iteration gate: changed packages and named cases only"
depends = ["setup"]
run = "python3 tools/ci/local_verify.py pr --base origin/main"

[tasks.fast]
description = "Run the repository fast gate; trailing arguments are forwarded"
depends = ["setup"]
run = "python3 tools/ci/local_verify.py fast --base origin/main"

[tasks.affected]
description = "Run the conservative affected gate for high-risk or uncertain integration closure"
depends = ["setup"]
run = "python3 tools/ci/local_verify.py affected --base origin/main"

[tasks.periodic]
description = "Run the full current-machine compatibility gate"
depends = ["setup"]
run = "python3 tools/ci/local_verify.py periodic"

[tasks."studio:check"]
description = "Install and check the locked Studio dependency tree"
depends = ["setup"]
dir = "{{config_root}}/studio"
run = "npm run check"

[tasks."studio:test"]
description = "Install and run Studio unit tests"
depends = ["setup"]
dir = "{{config_root}}/studio"
run = "npm test"

[tasks."studio:dev"]
description = "Install and start the Studio development server"
depends = ["setup"]
dir = "{{config_root}}/studio"
run = "npm run dev"

[tasks."site:setup"]
description = "Install the locked Astro/Starlight documentation toolchain"
dir = "{{config_root}}/docs/site"
sources = [
  "{{config_root}}/mise.toml",
  "{{config_root}}/mise.lock",
  "{{config_root}}/docs/site/package.json",
  "{{config_root}}/docs/site/package-lock.json",
]
outputs = ["{{config_root}}/docs/site/node_modules/.package-lock.json"]
run = "npm ci --engine-strict"

[tasks."site:sync"]
description = "Generate Astro content and TypeScript declarations"
depends = ["site:setup"]
dir = "{{config_root}}/docs/site"
run = "npm run sync"

[tasks."site:build"]
description = "Build the static Astro/Starlight source tree"
depends = ["site:setup"]
dir = "{{config_root}}/docs/site"
run = "npm run build"
