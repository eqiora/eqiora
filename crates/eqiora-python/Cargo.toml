[package]
name = "eqiora-python"
description = "Eqiora L4: private native adapter for the public Python SDK"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_eqiora"
crate-type = ["cdylib", "rlib"]

[dependencies]
eqiora = { workspace = true, features = ["diffsol", "sundials", "faer", "hdf5", "package-filesystem"] }
eqiora-numerics.workspace = true
numpy = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py311"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true }
ulid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true
