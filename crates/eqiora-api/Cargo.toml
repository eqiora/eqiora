[package]
name = "eqiora-api"
description = "Shared application service for Eqiora language and Studio clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
rayon = ["dep:eqiora-backend-rayon"]
project-filesystem = ["dep:cap-fs-ext", "dep:cap-std", "eqiora-package/filesystem", "dep:rustix", "dep:toml"]
xdmf = ["dep:eqiora-io-xml"]
hdf5 = ["xdmf", "dep:eqiora-io-hdf5"]
vtu = ["dep:eqiora-io-xml"]

[dependencies]
base64 = { workspace = true }
cap-fs-ext = { workspace = true, optional = true }
cap-std = { workspace = true, optional = true }
eqiora-assembly = { workspace = true }
eqiora-artifact = { workspace = true }
eqiora-compiler = { workspace = true }
eqiora-core = { workspace = true }
eqiora-differentiation = { workspace = true }
eqiora-execution = { workspace = true }
eqiora-backend-rayon = { workspace = true, optional = true }
eqiora-graph = { workspace = true }
eqiora-io-xml = { workspace = true, optional = true }
eqiora-io-hdf5 = { workspace = true, optional = true }
eqiora-ir = { workspace = true }
eqiora-geometry = { workspace = true }
eqiora-lang = { workspace = true }
eqiora-meshing = { workspace = true }
eqiora-numerics = { workspace = true }
eqiora-package = { workspace = true }
eqiora-realization = { workspace = true }
eqiora-sem = { workspace = true }
eqiora-solver = { workspace = true }
eqiora-schema = { workspace = true }
eqiora-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true, optional = true }
ulid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, optional = true, features = ["process"] }

[lints]
workspace = true

[dev-dependencies]
eqiora-backend-faer = { workspace = true }
